<!DOCTYPE html>
<html lang="id">

<head>
    <title>Formulir Pendaftaran - Festival Sains Nusantara 2026</title>
</head>

<body>

    <h1>Festival Sains Nusantara 2026</h1>
    <p>Explore Science, Inspire the Future</p>

    <div>
        <a href="index.html">Beranda</a> |
        <a href="acara.html">Acara</a> |
        <a href="jadwal.html">Jadwal</a> |
        <a href="formulir.html">Pendaftaran</a>
    </div>

    <hr>

    <div>
        <h2>Formulir Pendaftaran</h2>
        <p>Data Peserta</p>

        <form action="#" method="POST">

            <p>
                <label for="nama">Nama Lengkap:</label><br>
                <input type="text" id="nama" name="nama" required>
            </p>

            <p>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="nohp">Nomor Telepon:</label><br>
                <input type="text" id="nohp" name="nohp" required>
            </p>

            <p>
                <label for="institusi">Institusi/Asal Sekolah:</label><br>
                <input type="text" id="institusi" name="institusi" required>
            </p>

            <p>
                <label>Jenis Kelamin:</label><br>

                <input type="radio"
                       id="laki"
                       name="jenis_kelamin"
                       value="Laki-laki"
                       required>
                <label for="laki">Laki-laki</label>

                <input type="radio"
                       id="perempuan"
                       name="jenis_kelamin"
                       value="Perempuan"
                       required>
                <label for="perempuan">Perempuan</label>
            </p>

            <p>
                <label for="tanggal">Tanggal Lahir:</label><br>
                <input type="date" id="tanggal" name="tanggal_lahir" required>
            </p>

            <p>
                <label>Kategori Peserta:</label><br>

                <input type="radio"
                       id="pelajar"
                       name="Kategori_peserta"
                       value="Pelajar"
                       required>
                <label for="pelajar">Pelajar</label>

                <input type="radio"
                       id="mahasiswa"
                       name="Kategori_peserta"
                       value="Mahasiswa"
                       required>
                <label for="mahasiswa">Mahasiswa</label>

                <input type="radio"
                       id="umum"
                       name="Kategori_peserta"
                       value="Umum"
                       required>
                <label for="umum">Umum</label>
            </p>

            <p>
                <label>Pilihan Kegiatan:</label><br>

                <input type="checkbox"
                       id="fisika"
                       name="acara"
                       value="Workshop Eksperimen Fisika">
                <label for="fisika">Workshop Eksperimen Fisika</label>

                <br>

                <input type="checkbox"
                       id="data_science"
                       name="acara"
                       value="Workshop Dasar Data Science">
                <label for="data_science">Workshop Dasar Data Science</label>

                <br>

                <input type="checkbox"
                       id="teknologi"
                       name="acara"
                       value="Seminar Teknologi dan Masa Depan">
                <label for="teknologi">Seminar Teknologi dan Masa Depan</label>

                <br>

                <input type="checkbox"
                       id="robotika"
                       name="acara"
                       value="Workshop Robotika Dasar">
                <label for="robotika">Workshop Robotika Dasar</label>

                <br>

                <input type="checkbox"
                       id="science"
                       name="acara"
                       value="Kompetisi Science Project">
                <label for="science">Kompetisi Science Project</label>

                <br>

                <input type="checkbox"
                       id="challenge"
                       name="acara"
                       value="Kompetisi Data Challenge">
                <label for="challenge">Kompetisi Data Challenge</label>

                <br>

                <input type="checkbox"
                       id="energi"
                       name="acara"
                       value="Seminar Inovasi Energi">
                <label for="energi">Seminar Inovasi Energi</label>

                <br>

                <input type="checkbox"
                       id="ai"
                       name="acara"
                       value="Seminar Kecerdasan Buatan">
                <label for="ai">Seminar Kecerdasan Buatan</label>

                <br>

                <input type="checkbox"
                       id="robotik"
                       name="acara"
                       value="Kompetisi Robotik Nusantara">
                <label for="robotik">Kompetisi Robotik Nusantara</label>
            </p>

            <p>
                <label for="kebutuhan">
                    Kebutuhan Khusus/Informasi Tambahan:
                </label><br>

                <textarea id="kebutuhan"
                          name="pesan"
                          rows="5"
                          cols="40"
                          placeholder="Tuliskan kebutuhan atau informasi tambahan yang perlu diperhatikan panitia."></textarea>
            </p>

            <p>
                <button type="submit">Daftar Sekarang</button>
            </p>

        </form>
    </div>

    <br>
    <hr>

    <p>&copy; 2026 Nusantara Science Community</p>

</body>
</html>
